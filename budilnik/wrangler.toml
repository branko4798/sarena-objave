name = "budilnik-sarena"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
REPO = "branko4798/sarena-objave"
WORKFLOW = "objavi.yml"
GRANA = "main"

# Cloudflare cron ide po UTC-u, zato „svakih pola sata"; koji je sat u Beogradu računa
# worker, pa letnje/zimsko vreme ne traži izmenu.
[triggers]
crons = ["3,33 * * * *"]

[observability]
enabled = true
